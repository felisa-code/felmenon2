name: Publish website
on:
  push:
    branches: [main]
    paths-ignore: ['cases/**', 'catalog.pdf']
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  website:
    uses: ./.github/workflows/pipeline.yml
    secrets:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
